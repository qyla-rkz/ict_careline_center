<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengurusan Pengguna - Super Admin</title>
    <link rel="stylesheet" href="../assets/css/style.css?v=9">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        .table-container { overflow-x: auto; margin-top: 1.5rem; background: #fff; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8fafc; font-weight: 600; color: #475569; }
        .badge { padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.85rem; font-weight: 600; }
        .badge-active { background: #dcfce7; color: #166534; }
        .badge-suspended { background: #fee2e2; color: #991b1b; }
        .badge-superadmin { background: #fef08a; color: #854d0e; }
        .badge-admin { background: #dbeafe; color: #1e40af; }
        .badge-staff { background: #f3f4f6; color: #374151; }
        
        .action-btn { background: none; border: none; cursor: pointer; padding: 0.4rem 0.6rem; margin-right: 0.3rem; border-radius: 6px; font-weight: 600; font-size: 0.85rem; transition: 0.2s; }
        .btn-promote { background: #eff6ff; color: #2563eb; }
        .btn-promote:hover { background: #bfdbfe; }
        .btn-suspend { background: #fff1f2; color: #e11d48; }
        .btn-suspend:hover { background: #fecdd3; }
        .btn-delete { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .btn-delete:hover { background: #fee2e2; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-area">
                <div class="logo-icon">👑</div>
                <h2>Super Admin</h2>
            </div>
            <nav class="nav-links">
                <a href="dashboard.html" class="nav-link">📊 Papan Pemuka</a>
                <a href="users.html" class="nav-link active">👥 Pengguna</a>
                <a href="audit_logs.html" class="nav-link">📜 Jejak Audit</a>
                <a href="settings.html" class="nav-link">⚙️ Tetapan</a>
            </nav>
            <div style="margin-top: auto;">
                <a href="javascript:void(0)" onclick="logout()" class="nav-link" style="color: var(--danger);">🚪 Log Keluar</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid rgba(0,0,0,0.05); padding-bottom: 1rem;">
                <div>
                    <p style="color: var(--text-muted); font-weight: 600; margin-bottom: 0.25rem;">Super Admin Portal</p>
                    <h2 style="font-size: 1.8rem; color: var(--text-main);">Pengurusan Pengguna</h2>
                </div>
            </header>

            <section>
                <div style="margin-bottom: 1.5rem; display: flex; justify-content: flex-end;">
                    <div style="position: relative; width: 300px;">
                        <input type="text" id="searchInput" placeholder="Cari nama atau ID staf..." style="width: 100%; padding: 0.75rem 1rem 0.75rem 2.5rem; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-family: 'Outfit', sans-serif;">
                        <span style="position: absolute; left: 0.8rem; top: 50%; transform: translateY(-50%); color: #94a3b8;">🔍</span>
                    </div>
                </div>
                <div class="table-container" style="margin-top: 0;">
                    <table>
                        <thead>
                            <tr>
                                <th>ID Staf</th>
                                <th>Nama</th>
                                <th>Peranan (Role)</th>
                                <th>Status</th>
                                <th>Tindakan Khusus</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <tr><td colspan="5" style="text-align:center;">Memuatkan data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script>
        let allUsersData = [];

        document.addEventListener('DOMContentLoaded', () => {
            fetchUsers();
            
            document.getElementById('searchInput').addEventListener('input', function(e) {
                const searchTerm = e.target.value.toLowerCase();
                const filteredUsers = allUsersData.filter(user => {
                    const name = (user.name || '').toLowerCase();
                    const staffId = (user.staff_id || '').toLowerCase();
                    return name.includes(searchTerm) || staffId.includes(searchTerm);
                });
                renderUsers(filteredUsers);
            });
        });

        async function fetchUsers() {
            try {
                const res = await fetch('../api/superadmin/users_manage.php');
                const data = await res.json();
                
                if (data.status === 'success') {
                    allUsersData = data.data.users;
                    renderUsers(allUsersData);
                } else {
                    alert(data.message);
                }
            } catch (e) {
                console.error(e);
                alert("Gagal memuatkan senarai pengguna.");
            }
        }

        function renderUsers(users) {
            const tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = '';

            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 2rem;">Tiada pengguna dijumpai.</td></tr>';
                return;
            }

            users.forEach(user => {
                const roleClass = user.role.toLowerCase().includes('super') ? 'badge-superadmin' : (user.role.toLowerCase() === 'admin' ? 'badge-admin' : 'badge-staff');
                const statusClass = (user.status || 'active') === 'active' ? 'badge-active' : 'badge-suspended';
                
                let actionsHTML = '';
                
                // Don't allow changing yourself
                const currentUser = JSON.parse(localStorage.getItem('user'));
                if (user.id != currentUser.id) {
                    
                    // Promote/Demote button
                    if (user.role.toLowerCase() === 'staff') {
                        actionsHTML += `<button class="action-btn btn-promote" onclick="updateRole(${user.id}, 'Admin')">⬆️ Promote ke Admin</button>`;
                    } else if (user.role.toLowerCase() === 'admin') {
                        actionsHTML += `<button class="action-btn btn-promote" onclick="updateRole(${user.id}, 'Staff')">⬇️ Turun ke Staf</button>`;
                    }
                    
                    // Suspend/Activate button
                    if ((user.status || 'active') === 'active') {
                        actionsHTML += `<button class="action-btn btn-suspend" onclick="updateStatus(${user.id}, 'suspended')">⏸️ Gantung (Suspend)</button>`;
                    } else {
                        actionsHTML += `<button class="action-btn btn-promote" style="background:#dcfce7; color:#166534;" onclick="updateStatus(${user.id}, 'active')">▶️ Aktifkan Semula</button>`;
                    }

                    // Reset Password
                    actionsHTML += `<button class="action-btn" style="background:#f3f4f6; color:#4b5563;" onclick="resetPassword(${user.id})">🔑 Reset PWD</button>`;
                    
                    // Delete
                    actionsHTML += `<button class="action-btn btn-delete" onclick="deleteUser(${user.id})">🗑️ Padam</button>`;
                } else {
                    actionsHTML = '<span style="color:#9ca3af; font-size:0.85rem; font-style:italic;">Akaun Anda</span>';
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${user.staff_id}</strong></td>
                    <td>${user.name}<br><small style="color:#64748b;">${user.jawatan || '-'} | ${user.department || '-'}</small></td>
                    <td><span class="badge ${roleClass}">${user.role}</span></td>
                    <td><span class="badge ${statusClass}">${(user.status || 'active').toUpperCase()}</span></td>
                    <td>${actionsHTML}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function updateRole(id, newRole) {
            if (!confirm(`Adakah anda pasti mahu menukar peranan pengguna ini kepada ${newRole}?`)) return;
            const fd = new FormData();
            fd.append('action', 'update_role');
            fd.append('id', id);
            fd.append('role', newRole);
            await sendPost(fd);
        }

        async function updateStatus(id, newStatus) {
            if (!confirm(`Adakah anda pasti mahu menukar status pengguna ini kepada ${newStatus}?`)) return;
            const fd = new FormData();
            fd.append('action', 'update_status');
            fd.append('id', id);
            fd.append('status', newStatus);
            await sendPost(fd);
        }

        async function resetPassword(id) {
            if (!confirm(`Kata laluan pengguna ini akan di-reset kembali kepada ID Staf mereka. Teruskan?`)) return;
            const fd = new FormData();
            fd.append('action', 'reset_password');
            fd.append('id', id);
            await sendPost(fd);
        }

        async function deleteUser(id) {
            if (!confirm(`AMARAN KERAS: Adakah anda pasti mahu memadam pengguna ini terus dari sistem? Tindakan ini tidak boleh dipulihkan.`)) return;
            try {
                const res = await fetch('../api/superadmin/users_manage.php', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'id=' + id
                });
                const data = await res.json();
                alert(data.message);
                if (data.status === 'success') fetchUsers();
            } catch (e) {
                console.error(e);
                alert('Ralat sistem.');
            }
        }

        async function sendPost(formData) {
            try {
                const res = await fetch('../api/superadmin/users_manage.php', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                alert(data.message);
                if (data.status === 'success') fetchUsers(); // reload table
            } catch (e) {
                console.error(e);
                alert('Ralat sistem.');
            }
        }

        async function logout() {
            try {
                await fetch('../api/logout.php');
                localStorage.removeItem('user');
                window.location.replace('../login.html');
            } catch (err) {}
        }
    </script>
</body>
</html>
