<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetapan Sistem - Super Admin</title>
    <link rel="stylesheet" href="../assets/css/style.css?v=9">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        .settings-card { background: #fff; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: #475569; }
        .form-group input[type="text"], .form-group input[type="password"] { width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 6px; }
        .form-group select { width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 6px; }
    </style>
</head>
<body class="dashboard-body">
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-area">
                <div class="logo-icon">👑</div>
                <h2>Super Admin</h2>
            </div>
            <nav class="nav-links">
                <a href="dashboard.html" class="nav-link">📊 Papan Pemuka</a>
                <a href="users.html" class="nav-link">👥 Pengguna</a>
                <a href="audit_logs.html" class="nav-link">📜 Jejak Audit</a>
                <a href="settings.html" class="nav-link active">⚙️ Tetapan</a>
            </nav>
            <div style="margin-top: auto;">
                <a href="javascript:void(0)" onclick="logout()" class="nav-link" style="color: var(--danger);">🚪 Log Keluar</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid rgba(0,0,0,0.05); padding-bottom: 1rem;">
                <div>
                    <p style="color: var(--text-muted); font-weight: 600; margin-bottom: 0.25rem;">Super Admin Portal</p>
                    <h2 style="font-size: 1.8rem; color: var(--text-main);">Konfigurasi Sistem</h2>
                </div>
            </header>

            <section style="max-width: 800px;">
                <form id="settingsForm">
                    <!-- Mod Penyelenggaraan -->
                    <div class="settings-card">
                        <h3 style="margin-bottom: 1rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.5rem;">Tetapan Am</h3>
                        <div class="form-group">
                            <label for="maintenance_mode">Mod Penyelenggaraan (Maintenance Mode)</label>
                            <select id="maintenance_mode" name="maintenance_mode">
                                <option value="0">Tidak Aktif (Off)</option>
                                <option value="1">Aktif (On) - Tutup sistem kepada pengguna biasa</option>
                            </select>
                        </div>
                    </div>

                    <!-- SMTP Email Settings -->
                    <div class="settings-card">
                        <h3 style="margin-bottom: 1rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.5rem;">Tetapan Emel (SMTP)</h3>
                        <div class="form-group">
                            <label for="smtp_host">SMTP Host</label>
                            <input type="text" id="smtp_host" name="smtp_host" placeholder="smtp.gmail.com">
                        </div>
                        <div class="form-group">
                            <label for="smtp_port">SMTP Port</label>
                            <input type="text" id="smtp_port" name="smtp_port" placeholder="587">
                        </div>
                        <div class="form-group">
                            <label for="smtp_username">SMTP Username</label>
                            <input type="text" id="smtp_username" name="smtp_username" placeholder="email@domain.com">
                        </div>
                        <div class="form-group">
                            <label for="smtp_password">SMTP Password</label>
                            <input type="password" id="smtp_password" name="smtp_password" placeholder="Kosongkan jika tidak mahu tukar">
                        </div>
                    </div>

                    <button type="submit" class="cta-btn" id="saveBtn">Simpan Tetapan</button>
                </form>
            </section>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetchSettings();
            
            document.getElementById('settingsForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                await saveSettings();
            });
        });

        async function fetchSettings() {
            try {
                const res = await fetch('../api/superadmin/settings.php');
                const data = await res.json();
                
                if (data.status === 'success') {
                    const settings = data.data.settings;
                    if(settings.maintenance_mode) document.getElementById('maintenance_mode').value = settings.maintenance_mode;
                    if(settings.smtp_host) document.getElementById('smtp_host').value = settings.smtp_host;
                    if(settings.smtp_port) document.getElementById('smtp_port').value = settings.smtp_port;
                    if(settings.smtp_username) document.getElementById('smtp_username').value = settings.smtp_username;
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function saveSettings() {
            const btn = document.getElementById('saveBtn');
            btn.textContent = 'Menyimpan...';
            btn.disabled = true;

            const payload = {
                maintenance_mode: document.getElementById('maintenance_mode').value,
                smtp_host: document.getElementById('smtp_host').value,
                smtp_port: document.getElementById('smtp_port').value,
                smtp_username: document.getElementById('smtp_username').value
            };
            
            // Only update password if provided
            const pass = document.getElementById('smtp_password').value;
            if (pass) {
                payload.smtp_password = pass;
            }

            try {
                const res = await fetch('../api/superadmin/settings.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                
                if (data.status === 'success') {
                    alert('Tetapan sistem telah berjaya disimpan.');
                    document.getElementById('smtp_password').value = '';
                } else {
                    alert('Ralat: ' + data.message);
                }
            } catch (e) {
                console.error(e);
                alert('Gagal menyimpan tetapan.');
            } finally {
                btn.textContent = 'Simpan Tetapan';
                btn.disabled = false;
            }
        }

        async function logout() {
            try {
                await fetch('../api/logout.php');
                localStorage.removeItem('user');
                window.location.replace('../login.html');
            } catch (err) {}
        }
    </script>
</body>
</html>
